<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Einstellungen</title>

    <style>
        * {
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }

        body {
            background-color: #101214;
            min-height: 100vh;
            margin: 0;
        }

        /* ==============================
           NAVIGATION
        ============================== */

        .header {
            background-color: #1d1f21;
            border: 1px solid #414346;
            border-radius: 7px;

            padding: 20px;
            width: 100%;

            display: flex;
            justify-content: space-around;
            align-items: center;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .header label {
            color: white;
            font-weight: bold;

            cursor: pointer;
            user-select: none;
        }

        .header .active {
            background-color: white;

            border-radius: 9px;

            color: black !important;

            padding: 7px 12px;
        }

        /* ==============================
           SETTINGS
        ============================== */

        .settings {
            width: 90%;
            max-width: 1000px;

            margin: 30px auto;

            display: flex;
            flex-direction: column;

            gap: 20px;
        }

        /* ==============================
           HAUPT CONTAINER
        ============================== */

        .config-container {
            background-color: #1d1f21;

            border: 1px solid #414346;
            border-radius: 7px;

            padding: 20px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .config-container h2 {
            color: white;

            margin-top: 0;
            margin-bottom: 20px;

            border-bottom: 1px solid #414346;

            padding-bottom: 10px;
        }

        /* ==============================
           UNTER CONTAINER
        ============================== */

        .sub-container {
            background-color: #151719;

            border: 1px solid #414346;
            border-radius: 6px;

            padding: 15px;

            margin-top: 15px;
        }

        .sub-container h3 {
            color: white;

            margin-top: 0;
            margin-bottom: 15px;
        }

        /* ==============================
           EINSTELLUNG
        ============================== */

        .config-item {
            display: flex;

            align-items: center;

            gap: 20px;

            margin: 15px 0;
        }

        .config-item label {
            color: white;

            font-weight: bold;

            flex: 1;

            word-break: break-word;
        }

        /* ==============================
           INPUT WRAPPER
        ============================== */

        .input-wrapper {
            display: flex;

            align-items: center;

            gap: 10px;

            flex: 2;
        }

        /* ==============================
           NORMALE INPUTS
        ============================== */

        .config-item input[type="number"] {
            background-color: #101214;

            border: 1px solid #414346;

            border-radius: 5px;

            color: white;

            padding: 10px;

            width: 300px;

            outline: none;

            font-size: 14px;
        }

        .config-item input[type="number"]:focus {
            border-color: white;
        }

        /* ==============================
           TEXTAREA
        ============================== */

        .config-item textarea {
            background-color: #101214;

            border: 1px solid #414346;

            border-radius: 5px;

            color: white;

            padding: 12px;

            width: 100%;

            min-height: 180px;

            resize: vertical;

            outline: none;

            font-family: Arial, sans-serif;

            font-size: 14px;

            line-height: 1.5;
        }

        .config-item textarea:focus {
            border-color: white;
        }

        /* ==============================
           CHECKBOX
        ============================== */

        .config-item input[type="checkbox"] {
            width: 20px;
            height: 20px;

            cursor: pointer;
        }

        /* ==============================
           SPEICHER BUTTON
        ============================== */

        .save-button {
            background-color: white;

            border: none;

            border-radius: 6px;

            color: black;

            padding: 10px 15px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            white-space: nowrap;
        }

        .save-button:hover {
            background-color: #dddddd;
        }

        .save-button:disabled {
            background-color: #555;

            color: #aaa;

            cursor: not-allowed;
        }

        /* ==============================
           STATUS
        ============================== */

        .save-success {
            color: #4caf50;

            font-size: 13px;

            white-space: nowrap;
        }

        .save-error {
            color: #ff4444;

            font-size: 13px;

            white-space: nowrap;
        }

        /* ==============================
           LOADING
        ============================== */

        .loading {
            color: white;

            text-align: center;
        }

        .error-container {
            color: #ff4444;
        }

        /* ==============================
           TEXTAREA ROW
        ============================== */

        .config-item:has(textarea) {
            align-items: flex-start;
        }

        .config-item:has(textarea) label {
            padding-top: 12px;
        }

        .config-item:has(textarea) .input-wrapper {
            align-items: flex-start;
        }

        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 700px) {

            .settings {
                width: 95%;
            }

            .config-item {
                flex-direction: column;

                align-items: stretch;

                gap: 10px;
            }

            .input-wrapper {
                width: 100%;

                flex-direction: column;

                align-items: stretch;
            }

            .config-item input[type="number"],
            .config-item textarea {
                width: 100%;
            }

            .save-button {
                width: 100%;
            }

            .config-item:has(textarea) label {
                padding-top: 0;
            }
        }
    </style>
</head>

<body>

    <!-- ==============================
         LOGIN PRÜFEN
    ============================== -->

    <script>

        const user =
            JSON.parse(
                localStorage.getItem("user")
            );

        if (!user) {

            window.location.href =
                "/login.html";
        }

    </script>


    <!-- ==============================
         NAVIGATION
    ============================== -->

    <div class="header">

        <label onclick="home()">
            Home
        </label>

        <label onclick="users()">
            Users
        </label>

        <label class="active">
            Einstellungen
        </label>

        <label onclick="system()">
            System
        </label>

    </div>


    <!-- ==============================
         SETTINGS
    ============================== -->

    <div
        class="settings"
        id="settings"
    >

        <div class="loading">

            Einstellungen werden geladen...

        </div>

    </div>


    <script>

        /* ==========================================
           NAVIGATION
        ========================================== */

        function home() {

            window.location.href =
                "/dashboard.html";
        }


        function users() {

            window.location.href =
                "/users.html";
        }


        function system() {

            window.location.href =
                "/system.html";
        }


        /* ==========================================
           CONFIG LADEN
        ========================================== */

        async function loadConfig() {

            const user =
                JSON.parse(
                    localStorage.getItem("user")
                );


            if (!user) {

                window.location.href =
                    "/login.html";

                return;
            }


            try {

                const response =
                    await fetch(
                        `/api/config/get?auth=${encodeURIComponent(user.token)}`
                    );


                let data;


                try {

                    data =
                        await response.json();

                } catch {

                    throw new Error(
                        "API hat kein gültiges JSON zurückgegeben."
                    );
                }


                if (
                    !response.ok ||
                    data.error
                ) {

                    throw new Error(
                        data.error ||
                        "Fehler beim Laden der Config."
                    );
                }


                renderConfig(data);

            } catch (error) {

                console.error(error);


                document.getElementById(
                    "settings"
                ).innerHTML = `

                    <div class="config-container">

                        <h2>
                            Fehler
                        </h2>

                        <p class="error-container">

                            ${escapeHtml(
                                error.message
                            )}

                        </p>

                    </div>

                `;
            }
        }


        /* ==========================================
           CONFIG RENDERN
        ========================================== */

        function renderConfig(config) {

            const container =
                document.getElementById(
                    "settings"
                );


            container.innerHTML = "";


            for (
                const [key, value]
                of Object.entries(config)
            ) {


                /*
                 * Einfacher Wert
                 */

                if (
                    typeof value !== "object" ||
                    value === null ||
                    Array.isArray(value)
                ) {

                    const category =
                        createContainer(
                            formatName(key)
                        );


                    createInput(
                        key,
                        value,
                        category
                    );


                    container.appendChild(
                        category
                    );


                    continue;
                }


                /*
                 * Objekt / Kategorie
                 */

                const category =
                    createContainer(
                        formatName(key)
                    );


                renderObject(
                    value,
                    category,
                    key
                );


                container.appendChild(
                    category
                );
            }
        }


        /* ==========================================
           OBJEKT REKURSIV RENDERN
        ========================================== */

        function renderObject(
            object,
            parent,
            parentPath
        ) {

            for (
                const [key, value]
                of Object.entries(object)
            ) {

                const path =
                    `${parentPath}.${key}`;


                /*
                 * Unterobjekt
                 */

                if (
                    typeof value === "object" &&
                    value !== null &&
                    !Array.isArray(value)
                ) {

                    const subContainer =
                        document.createElement(
                            "div"
                        );


                    subContainer.className =
                        "sub-container";


                    const title =
                        document.createElement(
                            "h3"
                        );


                    title.textContent =
                        formatName(key);


                    subContainer.appendChild(
                        title
                    );


                    renderObject(
                        value,
                        subContainer,
                        path
                    );


                    parent.appendChild(
                        subContainer
                    );

                } else {

                    createInput(
                        path,
                        value,
                        parent
                    );
                }
            }
        }


        /* ==========================================
           CONTAINER ERSTELLEN
        ========================================== */

        function createContainer(
            title
        ) {

            const container =
                document.createElement(
                    "div"
                );


            container.className =
                "config-container";


            const heading =
                document.createElement(
                    "h2"
                );


            heading.textContent =
                title;


            container.appendChild(
                heading
            );


            return container;
        }


        /* ==========================================
           INPUT ERSTELLEN
        ========================================== */

        function createInput(
            path,
            value,
            parent
        ) {

            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                "config-item";


            /* LABEL */

            const label =
                document.createElement(
                    "label"
                );


            const name =
                path
                    .split(".")
                    .pop();


            label.textContent =
                formatName(name);


            wrapper.appendChild(
                label
            );


            /* INPUT WRAPPER */

            const inputWrapper =
                document.createElement(
                    "div"
                );


            inputWrapper.className =
                "input-wrapper";


            let input;


            /* ======================================
               BOOLEAN
            ====================================== */

            if (
                typeof value === "boolean"
            ) {

                input =
                    document.createElement(
                        "input"
                    );


                input.type =
                    "checkbox";


                input.checked =
                    value;


                input.dataset.configPath =
                    path;


                /*
                 * Sofort speichern
                 */

                input.addEventListener(
                    "change",
                    () => {

                        saveValue(input);

                    }
                );


                inputWrapper.appendChild(
                    input
                );
            }


            /* ======================================
               NUMBER
            ====================================== */

            else if (
                typeof value === "number"
            ) {

                input =
                    document.createElement(
                        "input"
                    );


                input.type =
                    "number";


                input.value =
                    value;


                input.dataset.configPath =
                    path;


                createSaveControls(
                    input,
                    inputWrapper
                );
            }


            /* ======================================
               STRING
               → TEXTAREA
            ====================================== */

            else if (
                typeof value === "string"
            ) {

                input =
                    document.createElement(
                        "textarea"
                    );


                input.value =
                    value;


                input.dataset.configPath =
                    path;


                createSaveControls(
                    input,
                    inputWrapper
                );
            }


            /* ======================================
               ARRAY
               → TEXTAREA
            ====================================== */

            else if (
                Array.isArray(value)
            ) {

                input =
                    document.createElement(
                        "textarea"
                    );


                input.value =
                    JSON.stringify(
                        value,
                        null,
                        2
                    );


                input.dataset.configPath =
                    path;


                createSaveControls(
                    input,
                    inputWrapper
                );
            }


            /* ======================================
               UNBEKANNTER TYP
            ====================================== */

            else {

                input =
                    document.createElement(
                        "textarea"
                    );


                input.value =
                    String(value ?? "");


                input.dataset.configPath =
                    path;


                createSaveControls(
                    input,
                    inputWrapper
                );
            }


            wrapper.appendChild(
                inputWrapper
            );


            parent.appendChild(
                wrapper
            );
        }


        /* ==========================================
           SAVE CONTROLS
        ========================================== */

        function createSaveControls(
            input,
            parent
        ) {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "save-button";


            button.textContent =
                "Speichern";


            const status =
                document.createElement(
                    "span"
                );


            button.addEventListener(
                "click",
                () => {

                    saveValue(
                        input,
                        button,
                        status
                    );

                }
            );


            parent.appendChild(
                input
            );


            parent.appendChild(
                button
            );


            parent.appendChild(
                status
            );
        }


        /* ==========================================
           WERT SPEICHERN
        ========================================== */

        async function saveValue(
            input,
            button = null,
            status = null
        ) {

            const user =
                JSON.parse(
                    localStorage.getItem(
                        "user"
                    )
                );


            if (!user) {

                window.location.href =
                    "/login.html";

                return;
            }


            const key =
                input.dataset.configPath;


            let value;


            /* ======================================
               BOOLEAN
            ====================================== */

            if (
                input.type === "checkbox"
            ) {

                value =
                    input.checked;
            }


            /* ======================================
               NUMBER
            ====================================== */

            else if (
                input.type === "number"
            ) {

                value =
                    Number(input.value);
            }


            /* ======================================
               ARRAY
            ====================================== */

            else if (
                input.dataset.configType === "array"
            ) {

                try {

                    value =
                        JSON.parse(
                            input.value
                        );

                } catch {

                    if (status) {

                        status.textContent =
                            "Ungültiges JSON";

                        status.className =
                            "save-error";
                    }

                    return;
                }
            }


            /* ======================================
               STRING
            ====================================== */

            else {

                value =
                    input.value;
            }


            /* ======================================
               BUTTON STATUS
            ====================================== */

            if (button) {

                button.disabled =
                    true;

                button.textContent =
                    "Speichert...";
            }


            if (status) {

                status.textContent =
                    "";

                status.className =
                    "";
            }


            try {

                const response =
                    await fetch(
                        "/api/config/set",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                auth:
                                    user.token,

                                key:
                                    key,

                                value:
                                    value

                            })
                        }
                    );


                let data;


                try {

                    data =
                        await response.json();

                } catch {

                    throw new Error(
                        "API hat kein gültiges JSON zurückgegeben."
                    );
                }


                if (
                    !response.ok ||
                    data.error
                ) {

                    throw new Error(
                        data.error ||
                        "Speichern fehlgeschlagen."
                    );
                }


                /* ==================================
                   CHECKBOX
                ================================== */

                if (
                    input.type === "checkbox"
                ) {

                    console.log(
                        "Gespeichert:",
                        key,
                        value
                    );

                    return;
                }


                /* ==================================
                   ERFOLG
                ================================== */

                if (button) {

                    button.textContent =
                        "Gespeichert";
                }


                if (status) {

                    status.textContent =
                        "✓";

                    status.className =
                        "save-success";
                }


                setTimeout(() => {

                    if (button) {

                        button.textContent =
                            "Speichern";
                    }


                    if (status) {

                        status.textContent =
                            "";

                        status.className =
                            "";
                    }

                }, 2000);


            } catch (error) {

                console.error(
                    "Speicherfehler:",
                    error
                );


                /* CHECKBOX FEHLER */

                if (
                    input.type === "checkbox"
                ) {

                    alert(
                        "Speichern fehlgeschlagen: " +
                        error.message
                    );

                    return;
                }


                /* NORMALER INPUT FEHLER */

                if (button) {

                    button.disabled =
                        false;

                    button.textContent =
                        "Speichern";
                }


                if (status) {

                    status.textContent =
                        error.message;

                    status.className =
                        "save-error";
                }
            }
        }


        /* ==========================================
           NAMEN FORMATIEREN
        ========================================== */

        function formatName(name) {

            return name
                .replace(/-/g, " ")
                .replace(/_/g, " ")
                .replace(
                    /\b\w/g,
                    char =>
                        char.toUpperCase()
                );
        }


        /* ==========================================
           HTML ESCAPEN
        ========================================== */

        function escapeHtml(text) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                text;


            return div.innerHTML;
        }


        /* ==========================================
           START
        ========================================== */

        loadConfig();

    </script>

</body>

</html>
