<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System</title>
<style>
        * {
    font-family: Arial, sans-serif;

}
        body {
    background-color: #101214;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.header {
    background-color: #1d1f21;
    border: 1px solid #414346;
    border-radius: 7px;
    padding: 1.3%;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);

    width: 100%;
    min-height: 50%;
    margin-top: 0;

    display: flex;
    justify-content: space-around;
    align-items: center;
}
.header h1 {
            color: white;
            font-weight: bold;
        }

        .header label {
            color: white;
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            user-select: none;
            cursor: pointer;
        }

        .active {
    background-color: white;
    border: 2px solid white;
    border-radius: 9px;
    color: black !important;
    padding: 0.3%;
}

.container {
    background-color: #1d1f21;
    border: 1px solid #414346;
    border-radius: 7px;
    padding: 5%;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);

    width: 25%;
    min-height: 50%;

    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.container label {
            color: white;
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            user-select: none;
        }

.container button {
    background-color: red;
    border: none;
    border-radius: 15px;
    color: black;

    padding: 1%;
    font-size: 20px;
    font-weight: bold;

    cursor: pointer;
}

.container h1 {
    color: white;
    font-weight: bold;
    text-align: center;
    margin-top: 0px;
}

.danger {
    border: 2px solid red;
    border-radius: 10px;
    padding: 20px;
    margin-top: 20px;

    display: flex;
    flex-direction: column;
    gap: 10px;
}



    </style>
</head>
<body>
    <script>
        const user = JSON.parse(localStorage.getItem("user"));
        if (!user) window.location.href = "/login.html";
    </script>

    <script>
        async function online() {
            window.location.href = "/online.html";
        }

        async function settings() {
            window.location.href = "/settings.html";
        }

        async function home() {
            window.location.href = "/dashboard.html";
        }

        async function update() {
            const res = await fetch("/api/update", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                auth: JSON.parse(localStorage.getItem("user")).token
            })
        });

        const data = await res.json()

        if (data.error) {
            alert(data.error)
        } else {
            alert("UPDATE Wird Durchgeführt. Bitte Nach dem Update den Bot Neustarten")
        }
        }
    </script>

    <div class="header">
        <label onclick="home()">Home</label>
        <label onclick="online()">Online</label>
        <label onclick="settings()">Einstellungen</label>
        <label class="active">System</label>
    </div>

    <div class="container">
        <h1>System </h1>
        <div class="danger">
        <label>System Updaten</label>
        <button>Update System</button>
        <br>
        <label>Erstelle ein Backup</label>
        <button>Backup</button>
        </div>
    </div>
    
</body>
</html>
