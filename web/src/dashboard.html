<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>

    <style>
        * {
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }

        body {
            background-color: #101214;
            margin: 0;
            color: white;
        }

        .header {
            background-color: #1d1f21;
            border: 1px solid #414346;
            border-radius: 7px;
            padding: 1.3%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);

            width: 100%;
            min-height: 50px;

            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .header label {
            color: white;
            font-weight: bold;
            display: block;
            padding: 0.3%;
            user-select: none;
            cursor: pointer;
        }

        .active {
            background-color: white;
            border: 2px solid white;
            border-radius: 9px;
            color: black !important;
            padding: 0.3%;
        }

        /* Dashboard */

        .dashboard {
            width: 95%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .dashboard h1 {
            margin-bottom: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: #1d1f21;
            border: 1px solid #414346;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
        }

        .card-title {
            color: #aeb4bb;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card-value {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .card-small {
            color: #8d949c;
            margin-top: 8px;
            font-size: 13px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #3ddc84;
            border-radius: 50%;
        }

        .error {
            color: #ff5c5c;
        }

        .last-update {
            color: #777;
            margin-top: 20px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <script>
        const user = JSON.parse(localStorage.getItem("user"));

        if (!user) {
            window.location.href = "/login.html";
        }
    </script>

    <script>
        function settings() {
            window.location.href = "/settings.html";
        }

        function system() {
            window.location.href = "/system.html";
        }

        function users() {
            window.location.href = "/users.html";
        }
    </script>


    <!-- Navigation -->

    <div class="header">
        <label class="active">Home</label>
        <label onclick="users()">Users</label>
        <label onclick="settings()">Einstellungen</label>
        <label onclick="system()">System</label>
    </div>


    <!-- Dashboard -->

    <main class="dashboard">

        <h1>System</h1>

        <div class="cards">

            <!-- RAM -->

            <div class="card">
                <div class="card-title">
                    🧠 RAM
                </div>

                <div class="card-value" id="ram">
                    -
                </div>

                <div class="card-small">
                    Heap: <span id="heap">-</span>
                </div>
            </div>


            <!-- CPU -->

            <div class="card">
                <div class="card-title">
                    ⚙️ CPU-Zeit
                </div>

                <div class="card-value" id="cpu">
                    -
                </div>

                <div class="card-small">
                    User: <span id="cpuUser">-</span>
                    <br>
                    System: <span id="cpuSystem">-</span>
                </div>
            </div>


            <!-- Uptime -->

            <div class="card">
                <div class="card-title">
                    ⏱️ Uptime
                </div>

                <div class="card-value" id="uptime">
                    -
                </div>

                <div class="card-small">
                    Node.js Prozess
                </div>
            </div>


            <!-- Node -->

            <div class="card">
                <div class="card-title">
                    🟢 Node.js
                </div>

                <div class="card-value status">
                    <span class="status-dot"></span>
                    Online
                </div>

                <div class="card-small" id="nodeVersion">
                    -
                </div>
            </div>

        </div>

        <div class="last-update">
            Letzte Aktualisierung:
            <span id="lastUpdate">-</span>
        </div>

    </main>


    <script>

        function formatUptime(seconds) {

            seconds = Math.floor(seconds);

            const days = Math.floor(seconds / 86400);
            seconds %= 86400;

            const hours = Math.floor(seconds / 3600);
            seconds %= 3600;

            const minutes = Math.floor(seconds / 60);
            seconds %= 60;

            return `${days}d ${hours}h ${minutes}m ${seconds}s`;
        }


        async function loadData() {

            try {

                const response = await fetch(
                    `/api/data?auth=${encodeURIComponent(user.token)}`
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Fehler");
                }


                // RAM

                document.getElementById("ram").textContent =
                    `${data.memoryMB.rss} MB`;

                document.getElementById("heap").textContent =
                    `${data.memoryMB.heapUsed} / ${data.memoryMB.heapTotal} MB`;


                // CPU

                document.getElementById("cpuUser").textContent =
                    `${(data.cpu.user / 1000000).toFixed(2)} s`;

                document.getElementById("cpuSystem").textContent =
                    `${(data.cpu.system / 1000000).toFixed(2)} s`;

                document.getElementById("cpu").textContent =
                    `${(
                        (data.cpu.user + data.cpu.system) / 1000000
                    ).toFixed(2)} s`;


                // Uptime

                document.getElementById("uptime").textContent =
                    formatUptime(data.node.uptime);


                // Node Version

                document.getElementById("nodeVersion").textContent =
                    `${data.node.version} • PID ${data.node.pid}`;


                // Zeitpunkt

                document.getElementById("lastUpdate").textContent =
                    new Date().toLocaleTimeString("de-DE");

            } catch (error) {

                console.error(error);

                document.getElementById("ram").textContent = "Fehler";
                document.getElementById("cpu").textContent = "Fehler";
                document.getElementById("uptime").textContent = "Fehler";

                document.getElementById("ram").classList.add("error");
            }
        }


        // Direkt laden
        loadData();

        // Alle 2 Sekunden aktualisieren
        setInterval(loadData, 2000);

    </script>

</body>
</html>
