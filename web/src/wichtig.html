<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Einstellungen</title>

    <style>
        * {
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }

        body {
            background-color: #101214;
            min-height: 100vh;
            margin: 0;
        }

        .header {
            background-color: #1d1f21;
            border: 1px solid #414346;
            border-radius: 7px;
            padding: 20px;
            width: 100%;

            display: flex;
            justify-content: space-around;
            align-items: center;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .header label {
            color: white;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        .header .active {
            background-color: white;
            border-radius: 9px;
            color: black !important;
            padding: 7px 12px;
        }

        .settings {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;

            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .config-container {
            background-color: #1d1f21;
            border: 1px solid #414346;
            border-radius: 7px;
            padding: 20px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .config-container h2 {
            color: white;

            margin-top: 0;
            margin-bottom: 20px;

            border-bottom: 1px solid #414346;
            padding-bottom: 10px;
        }

        .sub-container {
            background-color: #151719;

            border: 1px solid #414346;
            border-radius: 6px;

            padding: 15px;
            margin-top: 15px;
        }

        .sub-container h3 {
            color: white;

            margin-top: 0;
            margin-bottom: 15px;
        }

        .config-item {
            display: flex;
            align-items: center;
            gap: 10px;

            margin: 12px 0;
        }

        .config-item label {
            color: white;
            font-weight: bold;

            flex: 1;

            word-break: break-word;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .config-item input[type="text"],
        .config-item input[type="number"],
        .config-item textarea {
            background-color: #101214;

            border: 1px solid #414346;
            border-radius: 5px;

            color: white;

            padding: 10px;

            width: 300px;

            outline: none;
        }

        .config-item input:focus,
        .config-item textarea:focus {
            border-color: white;
        }

        .config-item textarea {
            min-height: 100px;
            resize: vertical;
        }

        .config-item input[type="checkbox"] {
            width: 20px;
            height: 20px;

            cursor: pointer;
        }

        .save-button {
            background-color: white;

            border: none;
            border-radius: 6px;

            color: black;

            padding: 10px 15px;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

            white-space: nowrap;
        }

        .save-button:hover {
            background-color: #dddddd;
        }

        .save-button:disabled {
            background-color: #555;
            color: #aaa;
            cursor: not-allowed;
        }

        .save-success {
            color: #4caf50;
            font-size: 13px;
            white-space: nowrap;
        }

        .save-error {
            color: #ff4444;
            font-size: 13px;
            white-space: nowrap;
        }

        .checkbox-status {
            font-size: 13px;
            min-width: 20px;
        }

        .loading {
            color: white;
            text-align: center;
        }

        .error-container {
            color: #ff4444;
        }

        @media (max-width: 700px) {

            .settings {
                width: 95%;
            }

            .config-item {
                flex-direction: column;
                align-items: stretch;
            }

            .input-wrapper {
                width: 100%;
            }

            .config-item input[type="text"],
            .config-item input[type="number"],
            .config-item textarea {
                width: 100%;
            }

            .save-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <script>
        const user = JSON.parse(localStorage.getItem("user"));

        if (!user) {
            window.location.href = "/login.html";
        }
    </script>


    <!-- NAVIGATION -->

    <div class="header">

        <label onclick="home()">
            Home
        </label>

        <label onclick="users()">
            Users
        </label>

        <label class="active">
            Einstellungen
        </label>

        <label onclick="system()">
            System
        </label>

    </div>


    <!-- EINSTELLUNGEN -->

    <div class="settings" id="settings">

        <div class="loading">
            Einstellungen werden geladen...
        </div>

    </div>


    <script>

        /*
         * ==========================================
         * NAVIGATION
         * ==========================================
         */

        function home() {
            window.location.href = "/dashboard.html";
        }

        function users() {
            window.location.href = "/users.html";
        }

        function system() {
            window.location.href = "/system.html";
        }


        /*
         * ==========================================
         * CONFIG LADEN
         * ==========================================
         */

        async function loadConfig() {

            const user =
                JSON.parse(
                    localStorage.getItem("user")
                );


            if (!user) {
                window.location.href =
                    "/login.html";

                return;
            }


            try {

                const response =
                    await fetch(
                        `/api/config/get?auth=${encodeURIComponent(user.token)}`
                    );


                let data;


                try {

                    data =
                        await response.json();

                } catch {

                    throw new Error(
                        "API hat kein gültiges JSON zurückgegeben."
                    );
                }


                if (
                    !response.ok ||
                    data.error
                ) {

                    throw new Error(
                        data.error ||
                        "Fehler beim Laden der Config."
                    );
                }


                renderConfig(data);


            } catch (error) {

                console.error(error);


                document.getElementById(
                    "settings"
                ).innerHTML = `

                    <div class="config-container">

                        <h2>Fehler</h2>

                        <p class="error-container">
                            ${escapeHtml(error.message)}
                        </p>

                    </div>

                `;
            }
        }


        /*
         * ==========================================
         * CONFIG DARSTELLEN
         * ==========================================
         */

        function renderConfig(config) {

            const container =
                document.getElementById(
                    "settings"
                );


            container.innerHTML = "";


            for (
                const [key, value]
                of Object.entries(config)
            ) {


                /*
                 * Einfacher Wert
                 */

                if (
                    typeof value !== "object" ||
                    value === null ||
                    Array.isArray(value)
                ) {

                    const category =
                        createContainer(
                            formatName(key)
                        );


                    createInput(
                        key,
                        value,
                        category
                    );


                    container.appendChild(
                        category
                    );

                    continue;
                }


                /*
                 * Kategorie
                 */

                const category =
                    createContainer(
                        formatName(key)
                    );


                renderObject(
                    value,
                    category,
                    key
                );


                container.appendChild(
                    category
                );
            }
        }


        /*
         * ==========================================
         * VERSCHACHTELTE OBJEKTE
         * ==========================================
         */

        function renderObject(
            object,
            parent,
            parentPath
        ) {

            for (
                const [key, value]
                of Object.entries(object)
            ) {

                const path =
                    `${parentPath}.${key}`;


                /*
                 * Verschachteltes Objekt
                 */

                if (
                    typeof value === "object" &&
                    value !== null &&
                    !Array.isArray(value)
                ) {

                    const subContainer =
                        document.createElement(
                            "div"
                        );


                    subContainer.className =
                        "sub-container";


                    const title =
                        document.createElement(
                            "h3"
                        );


                    title.textContent =
                        formatName(key);


                    subContainer.appendChild(
                        title
                    );


                    renderObject(
                        value,
                        subContainer,
                        path
                    );


                    parent.appendChild(
                        subContainer
                    );

                }


                /*
                 * Normaler Wert
                 */

                else {

                    createInput(
                        path,
                        value,
                        parent
                    );
                }
            }
        }


        /*
         * ==========================================
         * CONTAINER
         * ==========================================
         */

        function createContainer(
            titleText
        ) {

            const container =
                document.createElement(
                    "div"
                );


            container.className =
                "config-container";


            const title =
                document.createElement(
                    "h2"
                );


            title.textContent =
                titleText;


            container.appendChild(
                title
            );


            return container;
        }


        /*
         * ==========================================
         * INPUT ERSTELLEN
         * ==========================================
         */

        function createInput(
            path,
            value,
            parent
        ) {

            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                "config-item";


            const label =
                document.createElement(
                    "label"
                );


            const name =
                path
                    .split(".")
                    .pop();


            label.textContent =
                formatName(name);


            wrapper.appendChild(
                label
            );


            const inputWrapper =
                document.createElement(
                    "div"
                );


            inputWrapper.className =
                "input-wrapper";


            let input;


            /*
             * ======================================
             * BOOLEAN
             * ======================================
             */

            if (
                typeof value === "boolean"
            ) {

                input =
                    document.createElement(
                        "input"
                    );


                input.type =
                    "checkbox";


                input.checked =
                    value;


                input.dataset.configPath =
                    path;


                /*
                 * Checkbox SOFORT speichern
                 */

                input.addEventListener(
                    "change",
                    async () => {

                        await saveValue(
                            input
                        );

                    }
                );


                inputWrapper.appendChild(
                    input
                );

            }


            /*
             * ======================================
             * NUMBER
             * ======================================
             */

            else if (
                typeof value === "number"
            ) {

                input =
                    document.createElement(
                        "input"
                    );


                input.type =
                    "number";


                input.value =
                    value;


                input.dataset.configPath =
                    path;


                createSaveControls(
                    input,
                    inputWrapper
                );

            }


            /*
             * ======================================
             * ARRAY
             * ======================================
             */

            else if (
                Array.isArray(value)
            ) {

                input =
                    document.createElement(
                        "textarea"
                    );


                input.value =
                    JSON.stringify(
                        value,
                        null,
                        2
                    );


                input.dataset.configPath =
                    path;


                createSaveControls(
                    input,
                    inputWrapper
                );

            }


            /*
             * ======================================
             * STRING
             * ======================================
             */

            else {

                input =
                    document.createElement(
                        "input"
                    );


                input.type =
                    "text";


                input.value =
                    value ?? "";


                input.dataset.configPath =
                    path;


                createSaveControls(
                    input,
                    inputWrapper
                );
            }


            wrapper.appendChild(
                inputWrapper
            );


            parent.appendChild(
                wrapper
            );
        }


        /*
         * ==========================================
         * SPEICHERN BUTTON ERSTELLEN
         * ==========================================
         */

        function createSaveControls(
            input,
            parent
        ) {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "save-button";


            button.textContent =
                "Speichern";


            const status =
                document.createElement(
                    "span"
                );


            button.addEventListener(
                "click",
                () => {

                    saveValue(
                        input,
                        button,
                        status
                    );

                }
            );


            parent.appendChild(
                input
            );


            parent.appendChild(
                button
            );


            parent.appendChild(
                status
            );
        }


        /*
         * ==========================================
         * WERT SPEICHERN
         * ==========================================
         */

        async function saveValue(
            input,
            button = null,
            status = null
        ) {

            const user =
                JSON.parse(
                    localStorage.getItem(
                        "user"
                    )
                );


            if (!user) {

                window.location.href =
                    "/login.html";

                return;
            }


            const key =
                input.dataset.configPath;


            let value;


            /*
             * BOOLEAN
             */

            if (
                input.type === "checkbox"
            ) {

                value =
                    input.checked;
            }


            /*
             * NUMBER
             */

            else if (
                input.type === "number"
            ) {

                value =
                    Number(input.value);
            }


            /*
             * ARRAY / JSON
             */

            else if (
                input.tagName === "TEXTAREA"
            ) {

                try {

                    value =
                        JSON.parse(
                            input.value
                        );

                } catch {

                    if (status) {

                        status.textContent =
                            "Ungültiges JSON";

                        status.className =
                            "save-error";
                    }

                    return;
                }
            }


            /*
             * STRING
             */

            else {

                value =
                    input.value;
            }


            /*
             * Nur normale Inputs haben
             * einen Speichern-Button
             */

            if (button) {

                button.disabled =
                    true;

                button.textContent =
                    "Speichert...";
            }


            if (status) {

                status.textContent =
                    "";

                status.className =
                    "";
            }


            try {

                const response =
                    await fetch(
                        "/api/config/set",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                auth:
                                    user.token,

                                key:
                                    key,

                                value:
                                    value

                            })
                        }
                    );


                let data;


                try {

                    data =
                        await response.json();

                } catch {

                    throw new Error(
                        "API hat kein gültiges JSON zurückgegeben."
                    );
                }


                if (
                    !response.ok ||
                    data.error
                ) {

                    throw new Error(
                        data.error ||
                        "Speichern fehlgeschlagen."
                    );
                }


                /*
                 * ==================================
                 * CHECKBOX ERFOLGREICH
                 * ==================================
                 */

                if (
                    input.type === "checkbox"
                ) {

                    console.log(
                        "Gespeichert:",
                        key,
                        value
                    );

                    return;
                }


                /*
                 * ==================================
                 * NORMALE INPUTS ERFOLGREICH
                 * ==================================
                 */

                if (button) {

                    button.textContent =
                        "Gespeichert";
                }


                if (status) {

                    status.textContent =
                        "✓";

                    status.className =
                        "save-success";
                }


                setTimeout(() => {

                    if (button) {

                        button.textContent =
                            "Speichern";
                    }


                    if (status) {

                        status.textContent =
                            "";

                        status.className =
                            "";
                    }

                }, 2000);


            } catch (error) {

                console.error(
                    "Speicherfehler:",
                    error
                );


                /*
                 * Checkbox Fehler
                 */

                if (
                    input.type === "checkbox"
                ) {

                    alert(
                        "Speichern fehlgeschlagen: " +
                        error.message
                    );

                    return;
                }


                /*
                 * Normale Inputs Fehler
                 */

                if (button) {

                    button.disabled =
                        false;

                    button.textContent =
                        "Speichern";
                }


                if (status) {

                    status.textContent =
                        error.message;

                    status.className =
                        "save-error";
                }
            }
        }


        /*
         * ==========================================
         * NAMEN FORMATIEREN
         * ==========================================
         */

        function formatName(name) {

            return name
                .replace(/-/g, " ")
                .replace(/_/g, " ")
                .replace(
                    /\b\w/g,
                    char =>
                        char.toUpperCase()
                );
        }


        /*
         * ==========================================
         * HTML ESCAPEN
         * ==========================================
         */

        function escapeHtml(text) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                text;


            return div.innerHTML;
        }


        /*
         * ==========================================
         * START
         * ==========================================
         */

        loadConfig();

    </script>

</body>

</html>
